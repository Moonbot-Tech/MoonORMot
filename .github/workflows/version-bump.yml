name: version-bump

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  bump:
    # Skip runs triggered by the bot itself to avoid any chance of loops
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # full history: a push of several commits diffs before..after,
          # and `before` must be reachable (depth 2 would see only the last one)
          fetch-depth: 0

      - name: Bump version if code changed without manual bump
        run: bash .github/scripts/bump-version.sh "${{ github.event.before }}" "${{ github.sha }}"
